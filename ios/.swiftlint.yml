included:
  - DisasterAlert
  - DisasterAlertTests

excluded:
  - DerivedData
  - build

opt_in_rules:
  - force_unwrapping
  - empty_count
  - closure_spacing

force_cast: error
force_try: error
force_unwrapping: error

line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 600

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
